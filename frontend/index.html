<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShoreGuard — Lifeguard Video Agent</title>
<style>
  :root { --bg:#070b14; --panel:#0e1626; --line:#1d2a44; --txt:#e8eefc;
          --dim:#8fa1c4; --red:#ff2d2d; --amber:#ffb020; --green:#2fe08a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px;
           border-bottom:2px solid var(--line); background:#0a1120; }
  header h1 { margin:0; font-size:26px; letter-spacing:3px; }
  header h1 span { color:var(--red); }
  #srcbadge { background:#3a2b00; color:var(--amber); border:1px solid var(--amber);
              font-size:12px; font-weight:700; letter-spacing:1px;
              padding:5px 10px; border-radius:4px; }
  #clock { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  #alertbar { display:flex; align-items:center; gap:18px; padding:14px 20px;
              background:var(--red); color:#fff; font-size:20px; font-weight:800; }
  #alertbar[hidden] { display:none; }
  #alertbar.critical { animation:blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { background:#a31212; } }
  #ackbtn { margin-left:auto; font-size:18px; font-weight:800; padding:10px 26px;
            border:0; border-radius:6px; cursor:pointer; background:#fff; color:#a31212; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:14px; padding:14px; }
  #videopane { background:#000; border:2px solid var(--line); border-radius:8px;
               display:flex; align-items:center; justify-content:center; min-height:420px; }
  canvas { max-width:100%; height:auto; border-radius:4px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:12px 14px; margin-bottom:14px; }
  .panel h2 { margin:0 0 10px; font-size:13px; letter-spacing:2px; color:var(--dim); }
  .tower { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:16px; }
  .dot { width:18px; height:18px; border-radius:50%; background:var(--green); }
  .dot.red { background:var(--red); box-shadow:0 0 12px var(--red); }
  .dot.amber { background:var(--amber); box-shadow:0 0 12px var(--amber); }
  .dot.red-strobe { background:var(--red); animation:blink 0.5s steps(2) infinite; }
  #pa { margin-top:8px; font-size:14px; color:var(--amber); }
  #timeline { list-style:none; margin:0; padding:0; max-height:220px; overflow:auto; }
  #timeline li { padding:7px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  #timeline .t { color:var(--dim); font-variant-numeric:tabular-nums; margin-right:8px; }
  #timeline .sev-HIGH { color:var(--amber); font-weight:700; }
  #timeline .sev-CRITICAL { color:var(--red); font-weight:700; }
  #timeline .ver { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  #q { width:100%; padding:10px; font-size:15px; border-radius:6px;
       border:1px solid var(--line); background:#0a1120; color:var(--txt); }
  #ask { margin-top:8px; padding:9px 18px; font-size:15px; font-weight:700;
         border:0; border-radius:6px; background:#2b6cb0; color:#fff; cursor:pointer; }
  #answers { margin-top:10px; font-size:14px; white-space:pre-line; color:var(--txt); }
  #answers .hit { color:var(--dim); }
  .row { display:flex; align-items:center; justify-content:space-between; }
  #sirenbtn { padding:6px 14px; border-radius:6px; border:1px solid var(--line);
              background:#1a2440; color:var(--txt); cursor:pointer; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1>SHORE<span>GUARD</span></h1>
  <span id="srcbadge">SIMULATED FEED — DEMO MODE</span>
  <span id="clock"></span>
</header>

<div id="alertbar" hidden>
  <div id="alerttext"></div>
  <button id="ackbtn">ACKNOWLEDGE</button>
</div>

<main>
  <section id="videopane"><canvas id="feed" width="640" height="480"></canvas></section>
  <aside>
    <div class="panel">
      <h2>WARNING SYSTEM</h2>
      <div id="towers"></div>
      <div class="row" style="margin-top:8px">
        <span>SIREN: <b id="sirenstate">OFF</b></span>
        <button id="sirenbtn">TOGGLE</button>
      </div>
      <div id="pa"></div>
    </div>
    <div class="panel">
      <h2>EVENT TIMELINE</h2>
      <ul id="timeline"><li style="color:var(--dim)">All clear — monitoring…</li></ul>
    </div>
    <div class="panel">
      <h2>ASK THE FOOTAGE</h2>
      <input id="q" placeholder="e.g. when did the swimmer go under?">
      <button id="ask">ASK</button>
      <div id="answers"></div>
    </div>
  </aside>
</main>

<script>
const cv = document.getElementById('feed'), cx = cv.getContext('2d');
const img = new Image();
let currentAlertId = null;

const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.frame) { img.onload = () => cx.drawImage(img, 0, 0); img.src = 'data:image/jpeg;base64,' + m.frame; }
  renderWarning(m.warning);
  renderTimeline(m.events || []);
};

function renderWarning(w) {
  if (!w) return;
  document.getElementById('towers').innerHTML = w.towers.map(t =>
    `<div class="tower"><span class="dot ${t.light}"></span>${t.id}</div>`).join('');
  document.getElementById('sirenstate').textContent = w.siren ? 'ON' : 'OFF';
  document.getElementById('pa').textContent = w.pa_active ? '📢 PA: ' + w.pa_message : '';
  const unacked = (w.alerts || []).filter(a => !a.acked);
  const bar = document.getElementById('alertbar');
  if (unacked.length) {
    const a = unacked[unacked.length - 1];
    currentAlertId = a.id;
    document.getElementById('alerttext').textContent =
      `🚨 ${a.severity}: ${a.message}` + (a.escalated ? '  [ESCALATED — ALL TOWERS]' : '');
    bar.hidden = false;
    bar.classList.toggle('critical', a.severity === 'CRITICAL');
  } else { bar.hidden = true; currentAlertId = null; }
}

function renderTimeline(events) {
  if (!events.length) return;
  document.getElementById('timeline').innerHTML = events.slice().reverse().map(e =>
    `<li><span class="t">T+${e.t.toFixed(1)}s</span>` +
    `<span class="sev-${e.severity}">${e.type.replace(/_/g, ' ')}</span> — ${e.caption}` +
    (e.verified ? `<span class="ver">✓ ${e.verified.by}: ${e.verified.result} ` +
      `(${(e.verified.confidence * 100).toFixed(0)}%) — ${e.verified.rationale}</span>` : '') +
    `</li>`).join('');
}

document.getElementById('ackbtn').onclick = async () => {
  if (currentAlertId == null) return;
  await fetch(`/api/ack/${currentAlertId}`, {method: 'POST'});
};
document.getElementById('sirenbtn').onclick = async () => {
  await fetch('/api/siren', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
};
document.getElementById('ask').onclick = async () => {
  const q = document.getElementById('q').value;
  const r = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json();
  document.getElementById('answers').innerHTML =
    r.answer.replace(/\n/g, '<br>') +
    (r.results || []).map(h => `<div class="hit">T+${h.t.toFixed(1)}s · ${h.type}</div>`).join('');
};
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}, 1000);
</script>
</body>
</html>
